<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Adicionar Hábito</title>
    <link rel="stylesheet" href="../css/adicionarhabito.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700;900&display=swap">
</head>
<body>

    <a href="home.html" class="voltar-inicio">⟵ Voltar ao Início</a>

    <div class="container">
        <h1>Adicionar <span>Hábito</span></h1>0

        <div class="box">
            <label for="habitNameInput">Escreva o hábito que deseja adicionar:</label>
            <input type="text" id="habitNameInput" placeholder="Ex: Academia, Estudar, Meditar">
        </div>

        <div class="box"> 
            <label for="habitColorInput">Escolha a cor do hábito:</label>
            <input type="color" id="habitColorInput" value="#8A02C5"> 
        </div>

        <button class="btn add" id="addHabitSubmit">Adicionar Hábito</button>
        
        <button class="btn voltar" onclick="window.location.href='home.html'">Voltar</button>
    </div>

    <script src="../js/addHabitConnector.js"></script> 
</body>
</html>
