<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HabiBot | Health Time</title>
    
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,0,0" />
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="../css/global.css">
    <link rel="stylesheet" href="../css/chatbot.css">
    
    <script src="../js/chatbot.js" defer></script>
</head>
<body>

    <a href="../index.html" class="back-btn-chat">
        <span class="material-symbols-rounded">arrow_back</span>
        Voltar
    </a>

    <header class="chat-header">
        <div class="header-content">
            <div class="bot-text">
                <h2>HabiBot</h2>
                <p>Assistente de Rotina</p>
            </div>
        </div>
    </header>

    <div class="chat-container">
        <div class="chat incoming">
            <div class="chat-content">
                <div class="chat-details">
                    <div class="bot-avatar-small">🤖</div>
                    <p>Olá! Sou o HabiBot. Como posso ajudar a melhorar seus hábitos hoje?</p>
                </div>
            </div>
        </div>
    </div>

    <div class="typing-container">
        <div class="typing-content">
            <div class="typing-textarea">
                <textarea id="chat-input" placeholder="Digite sua dúvida sobre hábitos..." required></textarea>
                <button id="send-btn" class="material-symbols-rounded">send</button>
            </div>
        </div>
    </div>

</body>
</html>
