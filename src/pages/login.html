<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login | Health Time</title>
  <link rel="stylesheet" href="../css/global.css">
  <link rel="stylesheet" href="../css/auth.css">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,0,0" />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">

  <link rel="icon" href="../assets/icons/icon.png" type="image/png">
</head>
<body>

  <div class="container">
    <a href="../index.html" class="back-btn">
      <span class="material-symbols-rounded">arrow_back</span>
      Voltar ao início
    </a>

    <div class="split-screen form-side">
      <div class="form-box animate-up"> <h2 class="form-title">Bem-vindo de volta!</h2>
        <p class="subtitle">Continue sua jornada saudável.</p>

        <form action="home.html"> <input type="email" placeholder="Seu e-mail" required>
          <input type="password" placeholder="Sua senha" required>
          
          <button type="submit" class="btn-primary">Entrar</button>
        </form>

        <div class="divider">
          <span></span><p>OU</p><span></span>
        </div>

        <button class="google-btn">
          <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" alt="G">
          Entrar com Google
        </button>

        <p class="bottom-text">
          Ainda não tem conta? <a href="cadastro.html">Cadastre-se</a>
        </p>
      </div>
    </div>

    <div class="split-screen bg-side">
      <div class="text-content animate-up">
        <h2 class="tagline">Foco no resultado.</h2>
        <p class="subtext">Acesse suas métricas e continue evoluindo.</p>
      </div>
    </div>
  </div>

</body>
</html>
